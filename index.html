<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Adhocgrama — Adhoc Cultura</title>
    <!-- Tipografies Oficials -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --adhoc-yellow: #FFD600;
            --adhoc-black: #000000;
            --adhoc-dark-grey: #191919;
            --adhoc-light-grey: #F4F4F4;
            --adhoc-white: #FFFFFF;
            --adhoc-error: #E74C3C;
            --adhoc-success: #2ECC71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--adhoc-light-grey);
            color: var(--adhoc-black);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--adhoc-white);
            border: 3px solid var(--adhoc-black);
            padding: 24px 20px;
            box-shadow: 6px 6px 0px var(--adhoc-black);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--adhoc-black);
            padding-bottom: 12px;
        }

        .logo {
            max-width: 160px;
            height: auto;
            margin-bottom: 8px;
        }

        header h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            color: var(--adhoc-dark-grey);
        }

        .info-panel {
            background-color: var(--adhoc-yellow);
            border: 2px solid var(--adhoc-black);
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            line-height: 1.3;
        }

        .letters-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }

        .letter-tile {
            width: 42px;
            height: 42px;
            background: var(--adhoc-black);
            color: var(--adhoc-white);
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }

        .letter-tile:active {
            transform: scale(0.9);
        }

        .input-display {
            min-height: 50px;
            border: 2px solid var(--adhoc-black);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 3px;
            background-color: var(--adhoc-white);
            text-transform: uppercase;
            padding: 0 10px;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        button {
            padding: 12px 6px;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--adhoc-black);
            background-color: var(--adhoc-yellow);
            border: 2px solid var(--adhoc-black);
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--adhoc-black);
        }

        button:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--adhoc-black);
        }

        .btn-delete {
            background-color: #E6E6E6;
        }

        .btn-submit {
            background-color: var(--adhoc-black);
            color: var(--adhoc-white);
        }

        .feedback-message {
            color: var(--adhoc-error);
            font-weight: 600;
            font-size: 0.85rem;
            text-align: center;
            min-height: 18px;
        }

        .section-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            border-bottom: 2px solid var(--adhoc-black);
            padding-bottom: 4px;
            margin-top: 8px;
        }

        .found-words-box {
            background-color: var(--adhoc-light-grey);
            border: 2px solid var(--adhoc-black);
            padding: 10px;
            min-height: 60px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-content: flex-start;
        }

        .word-badge {
            background-color: var(--adhoc-white);
            border: 1px solid var(--adhoc-black);
            padding: 2px 8px;
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .word-badge.master {
            background-color: var(--adhoc-yellow);
        }

        .result-panel {
            display: none;
            background-color: var(--adhoc-yellow);
            border: 2px solid var(--adhoc-black);
            padding: 16px;
            text-align: center;
        }

        .result-panel h2 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
        }

        .share-btn {
            background-color: var(--adhoc-black);
            color: var(--adhoc-white);
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="bg-adhoc-cultura-400.png" alt="Adhoc Cultura Logo" class="logo">
        <h1>L'ADHOCGRAMA</h1>
        <p class="subtitle" id="challenge-day">CARREGANT REPTE...</p>
    </header>

    <div class="info-panel">
        <strong>💡 PISTA PER A LA PARAULA ADHOC:</strong><br>
        <span id="hint-text">...</span>
    </div>

    <div>
        <p style="text-align: center; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; margin-bottom: 6px;">
            Fes clic a les lletres o utilitza el teclat:
        </p>
        <div class="letters-container" id="letters-box"></div>
    </div>

    <div class="input-display" id="current-word"></div>

    <div class="actions-grid">
        <button class="btn-delete" onclick="deleteLetter()">BORRAR</button>
        <button onclick="shuffleDisplay()">MEIXCLAR</button>
        <button class="btn-submit" onclick="submitWord()">ENVIAR</button>
    </div>

    <div class="feedback-message" id="feedback"></div>

    <div>
        <div class="section-title">NIVELL CREATIU & EXPERT (PARAULES TROBADES)</div>
        <div class="found-words-box" id="found-words"></div>
    </div>

    <div class="result-panel" id="result-box">
        <h2 id="result-title">🎉 REPTE COMPLETAT!</h2>
        <p id="result-desc" style="font-size: 0.9rem; margin: 8px 0;"></p>
        <p class="definition" id="definition-text" style="font-style: italic; font-size: 0.85rem; margin-bottom: 10px;"></p>
        <button class="share-btn" onclick="copyResult()">📋 COPIAR RESULTAT PER AL XAT</button>
    </div>
</div>

<script>
    const reptes = [
        { 
            dia: 1, 
            lletres: ["U","C","L","R","A","T","U"], 
            pista: "Sense aquest concepte, la nostra feina no tindria cap sentit. (7 lletres)", 
            solucio: "CULTURA", 
            definicio: "L'horitzó i l'àmbit essencial on treballem perquè totes les persones puguin exercir els seus drets culturals.",
            anagrames: ["CURA", "RUTA", "CAR", "CUL", "ALT", "ART", "TAL", "TURA", "CAL", "CLAURA"]
        },
        { 
            dia: 2, 
            lletres: ["P","R","O","P","O","S","I","T"], 
            pista: "Raó que dona sentit al que fem i ens ajuda a decidir quan no hi ha una resposta evident. (8 lletres)", 
            solucio: "PROPÒSIT", 
            definicio: "L'horitzó que orienta projectes, decisions i manera de relacionar-nos.",
            anagrames: ["PORT", "PIS", "PRO", "ROP", "OSP", "TOP", "SPOT"]
        },
        { 
            dia: 3, 
            lletres: ["C","O","C","R","E","A","C","I","O"], 
            pista: "Procés de construir una resposta AMB les persones implicades, i no només per a elles. (9 lletres)", 
            solucio: "COCREACIÓ", 
            definicio: "Significa posar en relació coneixements, experiències i mirades diferents perquè la resposta final sigui realment compartida.",
            anagrames: ["CREA", "COCA", "OCA", "ROC", "ACCIÓ", "CORE", "ROCA"]
        }
    ];

    let currentChallenge = null;
    let currentInput = "";
    let foundWordsSet = new Set();
    let hasMasterWord = false;
    let currentScrambled = [];

    function normalizeText(text) {
        return text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
    }

    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initGame() {
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 0);
        const diff = now - start;
        const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
        
        const challengeIndex = (dayOfYear - 1) % reptes.length;
        currentChallenge = reptes[challengeIndex];

        document.getElementById('challenge-day').innerText = "REPTE DEL DIA #" + currentChallenge.dia;
        document.getElementById('hint-text').innerText = currentChallenge.pista;

        currentScrambled = shuffleArray(currentChallenge.lletres);
        renderLetters();
    }

    function renderLetters() {
        const lettersBox = document.getElementById('letters-box');
        lettersBox.innerHTML = '';
        currentScrambled.forEach((char) => {
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.innerText = char;
            tile.onclick = () => addLetter(char);
            lettersBox.appendChild(tile);
        });
    }

    function addLetter(char) {
        currentInput += char;
        updateDisplay();
    }

    function deleteLetter() {
        currentInput = currentInput.slice(0, -1);
        updateDisplay();
    }

    function updateDisplay() {
        document.getElementById('current-word').innerText = currentInput;
        document.getElementById('feedback').innerText = "";
    }

    function shuffleDisplay() {
        currentScrambled = shuffleArray(currentScrambled);
        renderLetters();
    }

    function submitWord() {
        if (currentInput.length < 3) {
            showFeedback("La paraula ha de tenir almenys 3 lletres!");
            return;
        }

        const normalizedInput = normalizeText(currentInput);
        const normalizedMaster = normalizeText(currentChallenge.solucio);
        const normalizedAnagrams = currentChallenge.anagrames.map(normalizeText);

        if (foundWordsSet.has(normalizedInput)) {
            showFeedback("Ja has trobat aquesta paraula!");
            currentInput = "";
            updateDisplay();
            return;
        }

        if (normalizedInput === normalizedMaster) {
            hasMasterWord = true;
            addFoundWord(currentChallenge.solucio, true);
            showFeedback("🎉 Has trobat La Paraula Adhoc!");
            checkGameEnd();
        } else if (normalizedAnagrams.includes(normalizedInput)) {
            addFoundWord(currentInput, false);
            showFeedback("✨ Bona paraula trobada!");
            checkGameEnd();
        } else {
            showFeedback("Paraula no vàlida o no inclosa al glossari!");
        }

        currentInput = "";
        updateDisplay();
    }

    function addFoundWord(word, isMaster) {
        const normalized = normalizeText(word);
        foundWordsSet.add(normalized);

        const container = document.getElementById('found-words');
        const badge = document.createElement('div');
        badge.className = 'word-badge' + (isMaster ? ' master' : '');
        badge.innerText = word + (isMaster ? ' ⭐' : '');
        container.appendChild(badge);
    }

    function showFeedback(msg) {
        document.getElementById('feedback').innerText = msg;
    }

    function checkGameEnd() {
        const creativeCount = Array.from(foundWordsSet).filter(w => w !== normalizeText(currentChallenge.solucio)).length;

        if (hasMasterWord) {
            const resultBox = document.getElementById('result-box');
            resultBox.style.display = 'block';
            document.getElementById('definition-text').innerText = '"' + currentChallenge.definicio + '"';
            
            if (creativeCount >= 3) {
                document.getElementById('result-title').innerText = "🟢 NIVELL MESTRE (3/3)";
                document.getElementById('result-desc').innerText = "Has trobat la Paraula Adhoc i més de 3 anagrames creatius!";
            } else {
                document.getElementById('result-title').innerText = "🟡 NIVELL ADHOC (2/3)";
                document.getElementById('result-desc').innerText = "Has trobat la Paraula Adhoc! Troba " + (3 - creativeCount) + " anagrames més per al Nivell Mestre.";
            }
        }
    }

    function copyResult() {
        const creativeCount = Array.from(foundWordsSet).filter(w => w !== normalizeText(currentChallenge.solucio)).length;
        let score = "⚪ 1/3";
        if (hasMasterWord && creativeCount >= 3) score = "🟢 3/3";
        else if (hasMasterWord) score = "🟡 2/3";

        const textToCopy = "Adhocgrama #" + currentChallenge.dia + ": " + score + "! Bon dia equip! ☕";
        navigator.clipboard.writeText(textToCopy).then(() => {
            alert("S'ha copiat el resultat al portapapers!");
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        initGame();

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace') {
                deleteLetter();
            } else if (e.key === 'Enter') {
                submitWord();
            } else if (/^[a-zA-ZçÇàèòáéíóúÀÈÒÁÉÍÓÚ]$/.test(e.key)) {
                addLetter(e.key.toUpperCase());
            }
        });
    });
</script>

</body>
</html>
